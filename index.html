<!doctype html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Práctica web — Informática III</title>
  </head>

  <body class="bg-gray-100 text-gray-800">

    <header class="bg-blue-600 text-white text-center p-6">
      <h1 class="text-3xl font-bold">
        Alitach
      </h1>

      <p class="text-lg mt-2">
        Confección y personalización textil
      </p>
    </header>

    <main class="p-6">

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <div class="md:col-span-2">

          <div class="flex flex-wrap gap-2 mb-6">

            <button
              data-categoria="Todos"
              class="boton-categoria bg-blue-600 text-white px-4 py-2 rounded">
              Todos
            </button>

            <button
              data-categoria="Chalecos"
              class="boton-categoria bg-white px-4 py-2 rounded">
              Chalecos
            </button>

            <button
              data-categoria="Bordado"
              class="boton-categoria bg-white px-4 py-2 rounded">
              Bordado
            </button>

            <button
              data-categoria="Serigrafía"
              class="boton-categoria bg-white px-4 py-2 rounded">
              Serigrafía
            </button>

            <button
              data-categoria="Accesorios"
              class="boton-categoria bg-white px-4 py-2 rounded">
              Accesorios
            </button>

            <button
              data-categoria="Uniformes"
              class="boton-categoria bg-white px-4 py-2 rounded">
              Uniformes
            </button>

            <button
              data-categoria="Bolsas"
              class="boton-categoria bg-white px-4 py-2 rounded">
              Bolsas
            </button>

            <button
              data-categoria="Sublimado"
              class="boton-categoria bg-white px-4 py-2 rounded">
              Sublimado
            </button>

          </div>

          <div
            id="catalogo"
            class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          </div>

        </div>

        <aside class="bg-white rounded-lg shadow p-4 h-fit">

          <h2 class="text-2xl font-bold mb-4">
            Mi pedido
          </h2>

          <ul id="lista-pedido" class="space-y-2">
          </ul>

          <p id="total" class="text-xl font-bold mt-4">
            Total: $0
          </p>

          <form id="form-cliente" class="mt-6">

            <div class="mb-4">
              <label for="nombre" class="block font-semibold mb-1">
                Nombre
              </label>

              <input
                id="nombre"
                name="nombre"
                type="text"
                class="w-full border rounded p-2"
              >

              <p
                id="error-nombre"
                class="text-sm text-red-600 hidden">
              </p>
            </div>

            <div class="mb-4">
              <label for="telefono" class="block font-semibold mb-1">
                Teléfono
              </label>

              <input
                id="telefono"
                name="telefono"
                type="text"
                class="w-full border rounded p-2"
              >

              <p
                id="error-telefono"
                class="text-sm text-red-600 hidden">
              </p>
            </div>

            <div class="mb-4">
              <label for="correo" class="block font-semibold mb-1">
                Correo
              </label>

              <input
                id="correo"
                name="correo"
                type="text"
                class="w-full border rounded p-2"
              >

              <p
                id="error-correo"
                class="text-sm text-red-600 hidden">
              </p>
            </div>

            <p
              id="error-pedido"
              class="text-sm text-red-600 hidden mb-4">
            </p>

            <button
              type="submit"
              class="w-full bg-blue-600 text-white font-semibold p-2 rounded hover:bg-blue-800">
              Confirmar pedido
            </button>

          </form>

          <button
            id="btn-vaciar"
            class="w-full bg-red-600 text-white font-semibold p-2 rounded mt-4 hover:bg-red-800">
            Vaciar pedido
          </button>

        </aside>

      </div>

      <section class="mt-8">

        <h2 class="text-2xl font-bold mb-4">
          Pedidos registrados
        </h2>

        <div
          id="pedidos-registrados"
          class="grid grid-cols-1 md:grid-cols-2 gap-4">
        </div>

      </section>

    </main>

    <footer class="bg-gray-800 text-white text-center p-4">
      <p class="font-semibold">
        Equipo ASKI
      </p>
    </footer>

    <script type="module" src="/src/main.js"></script>

  </body>

</html>
